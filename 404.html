<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>Wawa가전 | 경로 확인 중...</title>
  <script>
    (function () {
      var pathname = window.location.pathname || '/';

      if (sessionStorage.getItem('wawa_loop_guard') === '1') {
        sessionStorage.removeItem('wawa_loop_guard');
        return;
      }

      var cleanedPath = pathname.replace(/(\/index\.html)+$/i, '') || '/';
      var match = cleanedPath.match(/^(.*?)\/(?:admin|mypage|cart|checkout)\/?$/i);
      var basePath = match ? match[1] : cleanedPath.replace(/\/[^/]*$/, '');
      if (basePath && !basePath.startsWith('/')) basePath = '/' + basePath;
      basePath = basePath.replace(/\/+$/, '');

      var subMatch = cleanedPath.match(/\/(admin|mypage|cart|checkout)\/?$/i);
      if (subMatch && subMatch[1]) {
        sessionStorage.setItem('wawa_pending_route', '/' + subMatch[1].toLowerCase());
      }

      sessionStorage.setItem('wawa_loop_guard', '1');
      window.location.replace((basePath || '') + '/');
    })();
  </script>
</head>

<body></body>

</html>
